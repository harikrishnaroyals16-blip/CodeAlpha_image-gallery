<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="gallery-container">

        <h1>📱 Image Gallery</h1>
        <p class="subtitle">Explore beautiful images</p>

        <!-- Filter Buttons -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="nature">Nature</button>
            <button class="filter-btn" data-filter="technology">Technology</button>
            <button class="filter-btn" data-filter="business">Business</button>
            <button class="filter-btn" data-filter="travel">Travel</button>
            <button class="filter-btn" data-filter="cars">Cars</button>
            <button class="filter-btn" data-filter="architecture">Architecture</button>
        </div>

        <!-- Image Grid -->
        
    </div>

    <!-- Lightbox -->
<div class="gallery-grid">

    <!-- Nature -->
    <div class="gallery-item nature">
        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80" alt="Nature">
    </div>

    <div class="gallery-item nature">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Forest">
    </div>

    <!-- Technology -->
    <div class="gallery-item technology">
        <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80" alt="Technology">
    </div>

    <div class="gallery-item technology">
        <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=800&q=80" alt="Technology">
    </div>

    <!-- Business -->
    <div class="gallery-item business">
        <img src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=800&q=80" alt="Business">
    </div>

    <div class="gallery-item business">
        <img src="https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=800&q=80" alt="Business Meeting">
    </div>

    <!-- Travel -->
    <div class="gallery-item travel">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Travel">
    </div>

    <div class="gallery-item travel">
        <img src="https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=800&q=80" alt="Travel">
    </div>

    <!-- Cars -->
    <div class="gallery-item cars">
        <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=800&q=80" alt="Sports Car">
    </div>

    <div class="gallery-item cars">
        <img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=800&q=80" alt="Luxury Car">
    </div>

    <!-- Architecture -->
    <div class="gallery-item architecture">
        <img src="https://images.unsplash.com/photo-1487958449943-2429e8be8625?auto=format&fit=crop&w=800&q=80" alt="Architecture">
    </div>

    <div class="gallery-item architecture">
        <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=800&q=80" alt="Modern Architecture">
    </div>

</div>
    <div id="lightbox" class="lightbox">

        <button class="close-btn">&times;</button>

        <button class="nav-btn prev-btn">&#10094;</button>

        <img class="lightbox-content" id="lightbox-img" src="" alt="">

        <button class="nav-btn next-btn">&#10095;</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
